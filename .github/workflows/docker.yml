name: Build and Push Docker Image

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# AUDIT-178: least-privilege token, parity with the server workflow. Neither
# job needs GITHUB_TOKEN write scope — Docker Hub auth uses repo secrets.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Cache Go build and module cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: gofmt
        # Formatting gate (parity with the server repo). Fails if any tracked
        # Go file is not gofmt-clean.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        env:
          CGO_ENABLED: '1'
        run: go vet ./...

      - name: go test (race detector)
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 -timeout 120s ./...

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: staticcheck
        # AUDIT-178: pinned (not @latest) so a new staticcheck release can't
        # fail CI out from under an unrelated PR. Bump deliberately. v0.7.0 =
        # the 2026.1 release; same pin as the server repo.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: govulncheck
        # AUDIT-178: pinned for the same reason — the unpinned @latest gate
        # has already broken collector CI once when its vulnerability database
        # updated under an unrelated merge (see CHANGELOG 1.3.34). Bump
        # deliberately; same pin as the server repo.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  gosec:
    # AUDIT-224: security scan gate, parity with the server repo. A peer of
    # `test` (no needs:) exactly as the server runs it. The exclude list is
    # the collector-appropriate subset of the server's — rules with zero
    # collector hits (G117, G124, G203) are deliberately NOT excluded so a
    # future regression in those classes is caught:
    #   G115 — integer width conversions in the NetFlow/IPFIX wire decoders
    #          (Go idiom on scanned counters; same rationale as the server).
    #   G304 — file reads by operator-configured path (SSH key, own
    #          template-cache file, dev CLI arg).
    #   G401/G501 — MD5 config-backup fingerprint (checksumFromData): matches
    #          the server's configdiff checksum, and changing the algorithm
    #          would false-fire CONFIG_CHANGE fleet-wide at upgrade.
    #   G703 — dev-only test CLI (cmd/tftp-test), not built into the image.
    # G301/G402/G404 stay ENFORCED (fixed in code / per-line #nosec).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1

      - name: Run gosec
        run: gosec -quiet -severity medium -exclude=G115,G304,G401,G501,G703 ./...

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from source
        id: version
        run: |
          VERSION=$(grep -oP 'const version = "\K[^"]+' cmd/collector/main.go)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: xphox/firewall-collector
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=stable,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }}-sha-${{ github.sha }}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64
