name: Secret Scan

# Scans the commits a push or pull request introduces for leaked secrets with
# a pinned, checksum-verified gitleaks binary and the committed
# .gitleaks.toml. Pull requests scan base..head; pushes scan before..after,
# falling back to a full-history scan when there is no usable "before"
# (a new branch, a repository's first push, or a push after a rewrite).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan introduced commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
            range="${BEFORE}..${AFTER}"
          fi
          if [ -n "$range" ]; then
            echo "Scanning ${range}"
            gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts="$range"
          else
            echo "No usable base commit; scanning full history"
            gitleaks git . --config .gitleaks.toml --redact --no-banner
          fi
